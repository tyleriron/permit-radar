name: Daily Commercial Permit Radar

on:
  schedule:
    - cron: '17 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: permit-radar-production
  cancel-in-progress: false

jobs:
  fetch-permits:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Require private repository and default branch
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REPO_PRIVATE" != "true" ]; then
            echo "::error::Use a private repository: this workflow commits your business data and checkpoint."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run the production fetch on the default branch."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run Austin Commercial Permit Radar
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python fetch_permits.py --no-ai --days 14

      - name: Verify generated reports
        run: python verify_reports.py output

      - name: Upload CSV and briefing outputs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: austin-permit-radar-${{ github.run_id }}
          path: |
            output/
            state/checkpoint.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit updated feeds to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/ state/checkpoint.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh permit reports and checkpoint [skip ci]"
            git push
          else
            echo "No changes to permit CSV outputs."
          fi
